name: Test and build desktop packages
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux build and Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-libc-dev python3-dev xvfb xauth libxcb-cursor0 libxkbcommon-x11-0 libegl1 libopengl0 libgl1 libdbus-1-3 libxtst6
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q --basetemp=artifacts/test-tmp
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: python packaging/build.py --iscc "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
      - name: Linux package
        if: runner.os == 'Linux'
        run: xvfb-run -a env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: soma-${{ runner.os }}
          path: artifacts/${{ runner.os == 'Windows' && 'win32' || 'linux' }}/
